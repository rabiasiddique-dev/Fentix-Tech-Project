<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML Layout</title>
    <style>
        /* Basic Reset and Setup */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #ffffff;
            text-align: center;
        }

        /* Common styling for the blocks to match the wireframe */
        header, nav, aside, main, footer {
            background-color: #ebf0f5;
            color: #000000;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #e0e0e0;
        }

        /* Specific heights for header, nav, and footer */
        header { height: 40px; }
        nav { height: 30px; }
        footer { height: 40px; }

        /* The 3-Column Layout using CSS Grid on the parent container */
        section {
            display: grid;
            grid-template-columns: 1fr 3fr 1fr;
            gap: 10px;
            min-height: 400px; /* Gives the middle section some height */
        }
    </style>
</head>
<body>

    <header>
        Header
    </header>

    <nav>
        Navigation Menu
    </nav>

    <section>
        
        <aside>
            Content
        </aside>

        <main>
            Main Content
        </main>

        <aside>
            Content
        </aside>

    </section>

    <footer>
        Footer
    </footer>

</body>
</html>
